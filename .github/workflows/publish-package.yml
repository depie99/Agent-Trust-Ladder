name: Publish ATL package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: '@depie99'

      - name: Verify package
        run: |
          npm ci
          npm run docs:build
          npm run docs:check
          npx playwright install chromium
          node --check runtime/atl-manager.mjs
          node --check runtime/lib/skill-router.mjs
          python scripts/validate_model_routing.py
          node verification/package_smoke_test.mjs
          npm pack --dry-run

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
