name: Publish ATL package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: '@depie99'

      - name: Verify package
        run: |
          npm ci
          npm run docs:build
          npm run docs:check
          npx playwright install chromium
          node --check runtime/atl-manager.mjs
          node --check runtime/lib/skill-router.mjs
          python scripts/validate_model_routing.py
          node verification/package_smoke_test.mjs
          npm pack --dry-run

      - name: Build plugin bundles
        run: npm run plugins:build

      - name: Package plugin bundles
        shell: sh
        run: |
          for dir in dist/plugins/*/; do
            tar -czf "dist/atl-plugin-$(basename "$dir").tgz" -C "$dir" .
          done

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Issue #30: the built harness packages (DeepSeek included) travel with
      # the tagged release instead of staying out of the tree.
      - name: Attach plugin bundles to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/atl-plugin-*.tgz
          fail_on_unmatched_files: true
