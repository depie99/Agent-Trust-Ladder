name: Verify documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run docs:check
      - run: npm run docs:css:check
      - run: npm run docs:diagrams:check
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-browser-evidence
          path: .atl-evidence/docs-refresh/
