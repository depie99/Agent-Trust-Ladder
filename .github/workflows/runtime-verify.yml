name: Verify ATL runtime

on:
  push:
  pull_request:

jobs:
  runtime:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npx playwright install chromium
      - run: node --check runtime/atl-manager.mjs
      - run: node verification/approval_test.mjs
      - run: node verification/owner_session_approval_test.mjs
      - run: node verification/supervisor_test.mjs
      - run: node verification/supervisor_runner_test.mjs
      - run: node verification/control_assistant_test.mjs
      - run: node verification/execution_access_test.mjs
      - run: node verification/task_diagnostics_test.mjs
      - run: node verification/resource_policy_test.mjs
      - run: node verification/execution_report_test.mjs
      - run: node verification/provider_quota_failover_test.mjs
      - run: node verification/execution_report_ui_test.mjs
      - run: node verification/resource_policy_launch_test.mjs
      - run: node verification/resource_policy_planning_test.mjs
      - run: node verification/resource_policy_ui_test.mjs
      - run: node verification/ui_review_preview_test.mjs
      - run: node verification/ui_review_mcp_test.mjs
      - run: node verification/browser_access_test.mjs
      - run: node verification/control_plane_modal_test.mjs
      - run: node verification/session_auth_test.mjs
      - run: node verification/lease_test.mjs
      - run: node verification/backup_test.mjs
      - run: node verification/routine_test.mjs
      - run: node verification/dispatcher_test.mjs
      - run: node verification/governance_test.mjs
      - run: node verification/worker_test.mjs
      - run: node verification/worker_channel_test.mjs
      - run: node verification/worker_channel_launch_test.mjs
      - run: node verification/ui_refresh_runtime_test.mjs
      - run: node verification/concurrent_worker_test.mjs
      - run: node verification/control_plane_server_test.mjs
      - run: node verification/control_plane_task_run_test.mjs
      - run: node verification/control_plane_approval_clarity_test.mjs
      - run: node verification/task_changes_ui_test.mjs
      - run: node verification/package_smoke_test.mjs
      - run: node verification/e2e/full_operation_test.mjs
      - run: node verification/multi_queue_test.mjs
      - run: node verification/brain_test.mjs
      - run: node verification/brain_recovery_test.mjs
      - run: python verification/atl_manager_lifecycle_model.py
      - run: python verification/atl_manager_lifecycle_model.py --mutation-test
