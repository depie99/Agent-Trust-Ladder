name: Verify ATL runtime

on:
  push:
  pull_request:

jobs:
  runtime:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: node --check runtime/atl-manager.mjs
      - run: node verification/approval_test.mjs
      - run: node verification/owner_session_approval_test.mjs
      - run: node verification/supervisor_test.mjs
      - run: node verification/session_auth_test.mjs
      - run: node verification/lease_test.mjs
      - run: node verification/backup_test.mjs
      - run: node verification/routine_test.mjs
      - run: node verification/dispatcher_test.mjs
      - run: node verification/governance_test.mjs
      - run: node verification/worker_test.mjs
      - run: node verification/concurrent_worker_test.mjs
      - run: node verification/control_plane_server_test.mjs
      - run: node verification/control_plane_task_run_test.mjs
      - run: node verification/multi_queue_test.mjs
      - run: node verification/brain_test.mjs
      - run: node verification/brain_recovery_test.mjs
      - run: python verification/atl_manager_lifecycle_model.py
      - run: python verification/atl_manager_lifecycle_model.py --mutation-test
