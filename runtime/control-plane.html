  flex-wrap: wrap;

.diff-path {

  white-space: nowrap;

.diff-meta {

.diff-kind.kind-add {

.diff-kind.kind-del {
  color: var(--red);
}

.diff-kind.kind-mod {
  color: var(--blue);
}

.diff-stat.add {
  color: var(--green);

.diff-stat.del {
  color: var(--red);
  border-color: color-mix(in srgb, var(--red) 45%, transparent);
  font-weight: 700;
}

.diff-view {

  scrollbar-width: thin;
}

.diff-hunkbar {

  gap: 10px;

  padding: 5px 12px;

.diff-line {

.diff-line .diff-no {

}

.diff-line .diff-sign {
  text-align: center;
  color: var(--faint);
  user-select: none;
}

.diff-line .diff-code {
  padding-inline: 8px;
  min-width: 0;
}

.diff-line.add {
  background: color-mix(in srgb, var(--green) 11%, transparent);
}

.diff-line.add .diff-sign, .diff-line.add .diff-no:nth-child(2) {
  color: var(--green);
  font-weight: 700;
}

.diff-line.del {
  background: color-mix(in srgb, var(--red) 10%, transparent);
}

.diff-line.del .diff-sign {
  color: var(--red);
  font-weight: 700;
}

.diff-line.ctx {
  opacity: 0.8;
}

.diff-line.note {
  opacity: 0.6;
  font-style: italic;
}

.diff-line:hover {
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}

.task-workspace-layout {

  align-items: start;
}

.task-workspace-side .task-shell,

.task-workspace-side .tableitem.task-row {

.task-workspace-side .task-row .task-mid {

.task-workspace-side .task-row.is-selected {

.task-objective > .task-detail-description {

.task-workspace-tabs {

.task-workspace-tab {

.task-workspace-tab:hover {

.task-workspace-tab.active {

.task-workspace-viewbody {

.task-workspace-empty {

.task-workspace-empty-glyph {

.task-workspace-activity, .task-workspace-process {

.activity-stage-head {

.activity-stage-head .muted {

.activity-stage-glyph {

.activity-stage.is-planned {

.activity-stage.is-planned .activity-stage-glyph {

.activity-planned-list {

  gap: 6px;

}

.task-workspace-planned {

}

.activity-attempts {

.activity-attempt {

.activity-attempt > summary {

  gap: 4px 10px;
  align-items: center;
  padding: 8px 12px;
}
.activity-attempt > summary:hover {

}

.activity-attempt > summary::-webkit-details-marker {
  display: none;
}

.attempt-glyph {
  color: var(--faint);

  font-size: 12px;
}

.attempt-glyph.green {
  color: var(--green);
}

.attempt-glyph.red {
  color: var(--red);
}

.activity-attempt > summary b {
  font-size: 12.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.activity-attempt > summary .muted {
  font-size: 11px;
}

.activity-attempt.is-failed {
  background: color-mix(in srgb, var(--red) 7%, transparent);
}

.activity-attempt.is-active > summary b {

}

.attempt-detail {

.activity-events {

}

}

.activity-event-detail {
  overflow-wrap: anywhere;
}

.activity-commands {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.activity-command {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.activity-evidence {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.activity-capture {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 12px;
  border-top: 1px solid var(--row-line);
}

.activity-capture-files {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.activity-capture-files .review-file {
  display: flex;
  gap: 8px;
  align-items: center;
  width: 100%;
  text-align: start;
  background: var(--field-bg);
  border: 1px solid var(--row-line);
  border-radius: 7px;
  padding: 5px 9px;
  cursor: pointer;
  font: inherit;
  color: var(--text);
}
.activity-capture-files .review-file:hover {
  border-color: var(--accent-edge);
  background: var(--accent-bg);
}

.process-flow {
  display: flex;
  flex-direction: column;
}

.process-node {
  position: relative;
  display: grid;
  grid-template-columns: 14px minmax(0, 1fr);
  gap: 10px;
  padding: 4px 0 10px;
}

.process-node-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  margin: 5px auto 0;
  box-shadow: 0 0 0 3px var(--accent-bg);
}

.process-node.is-unknown .process-node-dot {
  background: var(--faint);
  box-shadow: 0 0 0 3px var(--chip);
}

.process-node::before {
  content: "";
  position: absolute;
  inset-inline-start: 6px;
  top: 18px;
  bottom: -6px;
  width: 1px;
  background: var(--border);
}

.process-node:last-of-type::before {
  display: none;
}

.process-node-body {
  min-width: 0;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.process-stage {
  border: 1px solid var(--row-line);
  border-radius: 10px;
  background: var(--raised);
  margin-bottom: 10px;
  overflow: hidden;
  position: relative;
}

.process-stage-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  background: var(--chip);
  border-bottom: 1px solid var(--row-line);
}

.process-stage-head b {
  font-size: 12.5px;
  letter-spacing: 0.2px;
}

.process-stage-head .activity-stage-glyph {
  color: var(--faint);
  font-size: 10px;
}

.process-stage-head .muted {
  margin-inline-start: auto;
  font-size: 10.5px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--chip);
  border: 1px solid var(--row-line);
  white-space: nowrap;
}

.process-attempts {
  display: flex;
  flex-direction: column;
}

.process-attempt {
  appearance: none;
  background: none;
  border: 0;
  cursor: pointer;
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto 92px;
  gap: 4px 10px;
  align-items: center;
  padding: 8px 14px;
  font: inherit;
  font-size: 12px;
  color: var(--text);
  text-align: start;
  border-bottom: 1px solid var(--row-line);
  transition: background 0.12s ease;
}
.process-attempt:hover {
  background: var(--row-hover);
}
.process-attempt:last-child {
  border-bottom: 0;
}

.process-attempt .attempt-glyph {
  font-size: 11px;
}

.process-attempt.is-running .attempt-glyph,
.process-attempt.is-running > .truncate {
  color: var(--green);
}

.process-attempt.is-running .attempt-glyph {
  animation: pulse 1.5s infinite;
}

.process-attempt.is-failed {
  background: color-mix(in srgb, var(--red) 7%, transparent);
}

.process-attempt .truncate {
  font-weight: 600;
}

.process-attempt .muted.tiny {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  font-size: 11px;
}

.process-attempt > .pill,
.process-check > .pill {
  justify-self: end;
  min-width: 84px;
  text-align: center;
  font-size: 10px;
  white-space: nowrap;
}

.process-attempt.is-running > .pill {
  color: var(--green);
  border-color: color-mix(in srgb, var(--green) 45%, var(--border));
}

.process-checks {
  display: flex;
  flex-direction: column;
}

.process-check {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto auto;
  gap: 4px 10px;
  align-items: center;
  padding: 6px 14px;
  font-size: 12px;
  border-bottom: 1px solid var(--row-line);
}
.process-check:last-child {
  border-bottom: 0;
}
.process-check .muted.tiny {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  font-size: 11px;
}

.process-attempt > .pill,
.activity-attempt > summary .pill {
  justify-self: end;
}

@media (prefers-reduced-motion: reduce) {
  .process-attempt.is-running .attempt-glyph {
    animation: none;
  }
}

r slot</span><span>0 / 1</span></div>'+meter(q==='Quality'?50:0)+'<div class="actionrow">'+btn('View tasks','queue:'+encodeURIComponent(q),'sm')+(tasks.some(t=>t.queue===q&&t.status==='Running')?'':btn('Run queue','run:'+encodeURIComponent(q),'sm'))+'</div></section>').join('')+'</div>',team:()=>head('OPERATIONS / TEAM','Five-agent team','Understand what each bot is doing, why it is blocked and what comes next.',btn('Agent events →','go:activity'))+'<div class="grid three">'+agents.map(a=>'<section class="panel pad"><div class="row between"><span class="avatar">'+a[0][0]+'</span>'+badge(a[2])+'</div><h2 style="font-size:16px;margin-top:12px">'+a[0]+'</h2><p class="sub">'+a[1]+'</p><div class="lined muted tiny">CURRENT WORK</div><p style="min-height:42px">'+a[3]+'</p><div class="row between tiny"><span class="muted">Progress · sample</span><b>'+a[4]+'%</b></div><div style="margin:9px 0 13px">'+meter(a[4],a[2]==='Blocked'?'var(--amber)':'var(--accent)')+'</div>'+btn('Read agent brief','agent:'+a[0],'sm')+'</section>').join('')+'</div>',activity:()=>head('OPERATIONS / EVIDENCE','Activity & Logs','Searchable decisions, feedback, blockers, verification and overnight handoffs.',btn('Overnight brief','overnight')+btn('Export sample','export'))+'<div class="grid three">'+stat('Events',events.length,'Sample event history')+stat('Blockers','3','Actions awaiting owner')+stat('Overnight tests','46 / 48','46 pass · 2 skip')+'</div><div class="grid twocol space">'+card('Timeline','<div class="pad">'+events.map(evt).join('')+'</div>')+card('Night-shift report','<div class="pad"><div class="row between"><strong>Nightly verification</strong>'+badge('PASS')+'</div><p class="sub">Example, not a real current report</p><div class="lined row between"><span>Passed</span><b class="green">46</b></div><div class="lined row between"><span>Skipped</span><b class="amber">2</b></div><div class="lined row between"><span>Escalations</span><b>0</b></div><div style="margin-top:20px">'+btn('Handoff report','overnight')+'</div></div>')+'</div>',usage:()=>head('OPERATIONS / RESOURCE MONITOR','Usage & Limits','Consumption by agent, provider quota provenance and dispatch risk controls.',btn('Refresh snapshot','refresh'))+'<div class="notice"><b class="amber">◈ No authoritative provider quota attached</b><p class="sub">The prototype never invents live remaining capacity. Real usage requires provider adapters, timestamps and provenance.</p></div><div class="grid three space">'+stat('Provider','Unlinked','Demo configuration only')+stat('Quota remaining','Unknown','Provider has not reported it')+stat('Reset window','Unknown','Cannot infer without source')+'</div><div class="grid two space">'+card('Metrics contract','<div class="pad">'+['Input/output tokens · per run','Cache usage · if reported','Cost · only if provider exposes pricing','Rate limit and retry-after headers','Remaining capacity and reset timestamp','Age of last authoritative sample'].map(s=>'<div class="event"><span class="green">○</span>'+s+'</div>').join('')+'</div>')+card('Preflight safeguards','<div class="pad"><div class="row between"><span>Provider limit</span>'+badge('Unknown')+'</div><div class="lined row between"><span>Dispatch policy</span><span class="amber">Confirm risks</span></div><div class="lined row between"><span>Stop on rate-limit</span><span class="green">Required</span></div><p class="sub" style="margin-top:18px">Distinguish exact provider quota, per-run token counts and local forecasts. Warn before starvation and checkpoint safely.</p></div>')+'</div>',settings:()=>head('WORKSPACE / SETTINGS','Settings','Safety defaults, skills, behavior and accessible terminal keybindings.')+'<div class="grid two">'+card('Proposed execution defaults','<div class="pad">'+[['Global concurrency','1'],['Planning provider calls','Owner confirms'],['Delete behavior','Archive before hard delete'],['Minimum supported columns','60'],['Unreported quota','Unknown']].map(r=>'<div class="event between" style="justify-content:space-between"><span class="muted">'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')+'</div>')+card('Keyboard reference','<div class="pad">'+[['Ctrl / Cmd K','Command palette'],['N','New task'],['1–7','Navigate pages'],['Enter','Run CLI command'],['Esc','Dismiss dialog']].map(r=>'<div class="event between" style="justify-content:space-between"><span class="key">'+r[0]+'</span><span class="muted">'+r[1]+'</span></div>').join('')+'</div>')+'</div>'};function nav(){let row=routes.map(r=>'<button class="nav '+(page===r[0]?'on':'')+'" data-page="'+r[0]+'"><span class="ico">'+r[1]+'</span>'+r[2]+'</button>');$('#navA').innerHTML=row.slice(0,4).join('');$('#navB').innerHTML=row.slice(4).join('');$('#mobile').innerHTML=routes.map(r=>'<button class="btn sm '+(page===r[0]?'primary':'')+'" data-page="'+r[0]+'">'+r[2]+'</button>').join('')}function go(p){if(!panels[p])return;page=p;nav();$('#crumb').textContent=routes.find(r=>r[0]===p)[2];$('#content').innerHTML=panels[p]()}function popup(title,body,actions=''){dialogOpen=true;$('#modal').innerHTML='<div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true"><div class="dialoghead"><h2 style="font-size:16px">'+title+'</h2>'+btn('✕','close','ghost')+'</div><div class="dialogbody">'+body+'</div>'+(actions?'<div class="dialogfoot">'+actions+'</div>':'')+'</section></div>'}function close(){dialogOpen=false;$('#modal').innerHTML=''}function form(t){popup(t?'Edit '+t.id:'New ATL task','<div class="field"><label class="label">Task title</label><input class="input" id="fTitle" value="'+escape(t?.title||'')+'" placeholder="Describe the task"></div><div class="field"><label class="label">Description and acceptance criteria</label><textarea class="input" id="fDesc">'+escape(t?.desc||'')+'</textarea></div><div class="grid two"><div class="field"><label class="label">Queue</label><select class="input" id="fQueue">'+queues.map(q=>'<option '+(q===t?.queue?'selected':'')+'>'+escape(q)+'</option>').join('')+'</select></div><div class="field"><label class="label">Agent</label><select class="input" id="fAgent">'+agents.map(a=>'<option '+(a[0]===t?.agent?'selected':'')+'>'+a[0]+'</option>').join('')+'</select></div><div class="field"><label class="label">Status</label><select class="input" id="fStatus">'+['Queued','Running','Blocked','Review','Done'].map(s=>'<option '+(s===(t?.status||'Queued')?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="field"><label class="label">Priority</label><select class="input" id="fPriority">'+['Low','Medium','High','Critical'].map(s=>'<option '+(s===(t?.priority||'Medium')?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div><p class="sub">Changes remain in memory only; reload resets demo data.</p>',btn('Cancel','close')+btn('Save task','save:'+(t?.id||''),'primary'));$('#fTitle').focus()}function detail(t){popup(t.id+' / Task details','<div class="bar">'+badge(t.status)+badge(t.priority)+'<span class="muted">'+escape(t.queue)+' · '+escape(t.agent)+'</span></div><h2 style="font-size:18px;margin:17px 0">'+escape(t.title)+'</h2><p>'+escape(t.desc)+'</p>'+(t.block?'<div class="notice"><b class="red">BLOCKER</b><p>'+escape(t.block)+'</p></div>':'')+'<div class="lined muted tiny">Skill path: atl-plan → atl-implement → verification</div>',btn('Archive','archive:'+t.id,'danger')+btn('Edit','edit:'+t.id)+btn('Plan task','plan:'+t.id,'primary'))}function commandOptions(q=''){return [...routes.map(r=>['Go to '+r[2],'go:'+r[0]]),['New task','new'],['CLI console','cli'],['Review blockers','blockers']].filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map(x=>'<button class="nav" data-action="'+x[1]+'">› '+x[0]+'</button>').join('')||'<p class="muted">No matching command</p>'}function palette(){popup('Command palette <span class="muted tiny">Ctrl K</span>','<input class="input" id="paletteQ" placeholder="Find a page or action..."><div id="paletteItems">'+commandOptions()+'</div>');$('#paletteQ').focus()}function cli(){popup('ATL CLI · simulated','<div class="terminal">'+escape(cliHistory.join('\n'))+'</div><div class="row space"><span class="green">atl ›</span><input id="cliInput" class="input" style="flex:1" placeholder="help"></div>');$('#cliInput').focus()}function command(raw){let c=raw.trim().toLowerCase();cliHistory.push('atl › '+raw);if(c==='help')cliHistory.push('Commands: help, tasks, team, queues, plan, usage, new, clear');else if(c==='tasks')cliHistory.push(tasks.map(t=>t.id+' ['+t.status+'] '+t.title).join('\n'));else if(c==='team')cliHistory.push(agents.map(a=>a[0]+' / '+a[1]+' / '+a[2]).join('\n'));else if(c==='queues')cliHistory.push(queues.join(' · '));else if(c==='usage')cliHistory.push('Quota unknown; no authoritative provider telemetry.');else if(c==='new'){close();form();return}else if(c==='plan'){close();go('studio');return}else if(c==='clear')cliHistory=[];else if(c)cliHistory.push('Unknown command. Type help.');cliHistory=cliHistory.slice(-35);cli()}function alertDemo(s){popup('Demo operation','<p>'+escape(s)+'</p>',btn('Close','close'))}function action(a){if(a==='close'){close();return}if(a==='new'){form();return}if(a==='palette'){palette();return}if(a==='cli'){cli();return}if(a.startsWith('go:')){close();go(a.slice(3));return}if(a.startsWith('filter:')){filter=a.slice(7);go('tasks');return}if(a==='blockers'){filter='Blocked';queueFilter='All';close();go('tasks');return}if(a.startsWith('edit:')){form(tasks.find(t=>t.id===a.slice(5)));return}if(a.startsWith('archive:')){tasks=tasks.filter(t=>t.id!==a.slice(8));close();go('tasks');return}if(a.startsWith('plan:')){let t=tasks.find(t=>t.id===a.slice(5));close();go('studio');$('#goal').value=t.desc;return}if(a.startsWith('save:')){let name=$('#fTitle').value.trim();if(!name){$('#fTitle').focus();return}let id=a.slice(5),t=tasks.find(t=>t.id===id);if(!t){t={id:'T-'+String(Math.max(...tasks.map(x=>Number(x.id.slice(2))),0)+1).padStart(3,'0'),block:''};tasks.unshift(t)}Object.assign(t,{title:name,desc:$('#fDesc').value,status:$('#fStatus').value,priority:$('#fPriority').value,queue:$('#fQueue').value,agent:$('#fAgent').value});close();go('tasks');return}if(a==='generate'){let goal=$('#goal').value.trim();$('#planOutput').innerHTML='<b class="green">Local draft breakdown</b><p>'+escape(goal)+'</p><ol><li>Define state and persistence contracts.</li><li>Specify UI pages and interaction behavior.</li><li>Write acceptance and recovery tests.</li><li>Implement bounded tasks with owner approval gates.</li><li>Verify runtime logs, accessibility and provider-limit provenance.</li></ol><span class="muted tiny">Mock only; ATL skills and provider have not been called.</span>';return}if(a.startsWith('queue:')){queueFilter=decodeURIComponent(a.slice(6));filter='All';go('tasks');return}if(a.startsWith('run:')){alertDemo('Real execution requires ATL manager connectivity, an approved plan and queue permissions.');return}if(a.startsWith('agent:')){let agent=agents.find(x=>x[0]===a.slice(6));popup(agent[0]+' / Agent brief','<div class="bar">'+badge(agent[2])+'<span>'+agent[1]+'</span></div><p>Current assignment: '+agent[3]+'</p>'+meter(agent[4])+'<p class="sub space">A production agent brief also links its session, model usage, latest log lines, handoffs, test evidence and checkpoint.</p>',btn('Logs','go:activity')+btn('Close','close'));return}if(a==='newqueue'){popup('Create named queue','<label class="label">Queue name</label><input class="input" id="queueName" placeholder="e.g. Security">',btn('Cancel','close')+btn('Create','savequeue','primary'));return}if(a==='savequeue'){let x=$('#queueName').value.trim();if(x&&!queues.includes(x)){queues.push(x);close();go('queues')}return}if(a==='overnight'){popup('Overnight handoff · sample','<h2>46 tests passed · 2 skipped</h2><p class="sub">Example report. In production include run IDs, code changes, test evidence, failure causes, retries and resume checkpoints.</p>',btn('Close','close'));return}if(a==='refresh'){alertDemo('Authoritative usage sampling requires a connected provider adapter. Remaining capacity is unknown.');return}if(a==='export'){let blob=new Blob([events.map(e=>e.join(' | ')).join('\n')],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='atl-demo-activity.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){go(p.dataset.page);return}let t=e.target.closest('[data-task]');if(t){let found=tasks.find(x=>x.id===t.dataset.task);if(found)detail(found);return}let a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}if(e.target.id==='overlay')close()});document.addEventListener('input',e=>{if(e.target.id==='paletteQ')$('#paletteItems').innerHTML=commandOptions(e.target.value);if(e.target.id==='taskSearch'){query=e.target.value;let i=e.target.selectionStart;go('tasks');let el=$('#taskSearch');el.focus();el.setSelectionRange(i,i)}});document.addEventListener('change',e=>{if(e.target.id==='queueSelect'){queueFilter=e.target.value;go('tasks')}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='cliInput'||e.target.id==='dockInput')){let val=e.target.value;e.target.value='';command(val);return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette();return}if(e.key==='Escape'&&dialogOpen){close();return}if(e.target.matches('input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key.toLowerCase()==='n'){form();return}let n=Number(e.key);if(n>=1&&n<=7)go(routes[n-1][0])});$('#searchBtn').onclick=palette;$('#newBtn').onclick=()=>form();$('#noticesBtn').onclick=()=>popup('Notifications',notifications.map(n=>'<div class="event">'+badge(n[0])+' '+escape(n[1])+'</div>').join(''),btn('Close','close'));go('overview');})();
