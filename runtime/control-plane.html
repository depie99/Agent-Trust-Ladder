  --term-edge: #314459;
  --dialog-edge: #536781;
  --dock-edge: #34445c;
  --avatar-edge: #3c7f70;
  --notice-edge: #635036;
  --plan-edge: #526482;
  --accent: #4fe1b6;
  --red: #fb8792;
  --amber: #f3c073;
  --blue: #90b4fa;
  --violet: #bea9ff;
  --backdrop: rgba(3, 7, 11, 0.8549019607843137);
  --dialog-shadow: rgba(0, 0, 0, 0.6);
  --accent-fade: rgba(79, 225, 182, 0);
}

html.light {
  color-scheme: light;
  --bg: #f2f5f9;
  --side: #e9eef5;
  --pane: #ffffff;
  --raised: #f7fafc;
  --chip: #e6edf4;

  --red: #c2372c;
  --amber: #9a6709;

  --dialog-shadow: rgba(22, 32, 43, 0.4);
  --accent-fade: rgba(12, 125, 98, 0);
}

:root {
  font: 13px/1.5 ui-monospace, Consolas, "SFMono-Regular", monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

button, input, select, textarea {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
}

button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 229px;
  background: var(--side);
  border-right: 1px solid var(--border);
  padding: 21px 13px;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.brand {
  font-size: 17px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 7px 21px;
}

.brandicon {
  background: var(--accent);
  color: var(--on-accent);
  border-radius: 8px;
  padding: 4px 10px;
}

.subbrand {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
}

.workspace {
  padding: 12px;
  background: var(--chip);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 4px 2px 16px;
}

.tiny {
  font-size: 11px;
}

.muted {
  color: var(--muted);
}

.section {
  font-size: 10px;
  color: var(--faint);
  font-weight: 800;
  letter-spacing: 1.5px;
  margin: 17px 11px 7px;
}

.nav {
  border: 0;
  background: transparent;
  display: flex;
  gap: 12px;
  align-items: center;
  text-align: left;
  padding: 10px 13px;
  width: 100%;
  border-radius: 7px;
  color: var(--nav-ink);
}

.nav:hover, .nav.on {
  background: var(--nav-on);
  color: var(--accent);
}

.nav .ico {
  width: 17px;
  font-size: 16px;
}

.nav b {
  margin-left: auto;
  font-size: 10px;
}

.sidebottom {
  margin-top: auto;
  padding: 17px 7px;
  border-top: 1px solid var(--border);
}

.provider-summary {
  width: 100%;
  border: 0;
  background: transparent;
  padding: 0;
  text-align: left;
  color: inherit;
}

.provider-summary:hover strong, .provider-summary:focus-visible strong {
  color: var(--accent);
}

.provider-summary strong {
  display: block;
  margin-top: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.provider-summary .status-detail {
  display: block;
  margin-top: 5px;
  line-height: 1.45;
}

.provider-manager {
  width: 100%;
  border: 0;
  background: transparent;
  padding: 14px 0 0;
  text-align: left;
}

.provider-manager:hover b, .provider-manager:focus-visible b {
  color: var(--accent);
}

.main {
  flex: 1;
  min-width: 0;
}

.topbar {
  height: 63px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  gap: 10px;
}

.row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.between {
  justify-content: space-between;
}

.pill {
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 5px;
  background: var(--pill-bg);
  border: 1px solid var(--pill-edge);
  white-space: nowrap;
}

.green {
  color: var(--accent);
}

.red {
  color: var(--red);
}

.amber {
  color: var(--amber);
}

.blue {
  color: var(--blue);
}

.violet {
  color: var(--violet);
}

.btn {
  border: 1px solid var(--btn-edge);
  background: var(--btn-bg);
  color: var(--btn-ink);
  border-radius: 7px;
  padding: 8px 11px;
}

.btn:hover {
  border-color: var(--btn-edge-hover);
  background: var(--btn-bg-hover);
}

.btn.primary {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
  font-weight: 800;
}

.btn.danger {
  color: var(--red);
}

.btn.ghost {
  background: transparent;
  border: 0;
  color: var(--muted);
}

.btn.sm {
  padding: 5px 8px;
  font-size: 11px;
}

#themeBtn::before {
  content: "☼";
}

html.light #themeBtn::before {
  content: "☾";
}

.key {
  border: 1px solid var(--key-edge);
  background: var(--chip);
  border-radius: 4px;
  padding: 1px 4px;
  font-size: 10px;
}

.body {
  padding: 27px;
  max-width: 1590px;
  margin: auto;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--accent);
  font-weight: 800;
}

.pagehead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
}

.pagehead h1 {
  font-size: 28px;
  letter-spacing: -1.2px;
  line-height: 1.2;
  margin: 7px 0;
}

h2 {
  font-size: 13px;
  margin: 0;
  font-weight: 800;
}

p.sub {
  font-size: 12px;
  color: var(--muted);
  margin: 4px 0;
}

.grid {
  display: grid;
  gap: 14px;
}

.four {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.twocol {
  grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr);
}

.panel {
  background: var(--pane);
  border: 1px solid var(--border);
  border-radius: 10px;
  min-width: 0;
  overflow: hidden;
}

.panel[data-queue]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.pad {
  padding: 19px;
}

.paneltitle {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stat {
  padding: 20px;
}

.stat strong {
  font-size: 33px;
  display: block;
  margin: 3px 0;
}

.stat small {
  color: var(--muted);
}

.space {
  margin-top: 14px;
}

.tableitem {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 88px 93px;
  gap: 12px;
  align-items: center;
  padding: 13px 17px;
  border-bottom: 1px solid var(--row-line);
  cursor: pointer;
}

.tableitem:hover {
  background: var(--row-hover);
}

.tableitem:last-child {
  border: 0;
}

.truncate {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.track {
  height: 6px;
  border-radius: 7px;
  background: var(--track);
  overflow: hidden;
}

.fill {
  background: var(--accent);
  height: 100%;
  border-radius: 7px;
}

.task-progress {
  margin-top: 9px;
}

.task-progress .row {
  font-size: 11px;
}

.running-mark {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.5s infinite;
  margin-right: 5px;
}

@keyframes pulse {
  70% {
    box-shadow: 0 0 0 7px var(--accent-fade);
  }
}
.event {
  padding: 11px 0;
  border-bottom: 1px solid var(--row-line);
  display: flex;
  gap: 13px;
}

.event:last-child {
  border: 0;
}

.input {
  border: 1px solid var(--field-edge);
  background: var(--field-bg);
  border-radius: 7px;
  color: var(--text);
  padding: 10px;
  width: 100%;
  min-width: 0;
}

.input:focus {
  border-color: var(--accent);
}

textarea.input {
  resize: vertical;
  min-height: 110px;
}

.label {
  color: var(--label-ink);
  font-size: 11px;
  display: block;
  margin-bottom: 6px;
}

.field {
  margin-bottom: 15px;
}

.bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.flow {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.step {
  padding: 9px;
  border: 1px solid var(--field-edge);
  border-radius: 6px;
  font-size: 11px;
  color: var(--step-ink);
}

.step.current {
  color: var(--accent);
  border-color: var(--step-on-edge);
  background: var(--step-on-bg);
}

.terminal {
  background: var(--term-bg);
  border-radius: 8px;
  border: 1px solid var(--term-edge);
  color: var(--term-ink);
  padding: 15px;
  min-height: 250px;
  max-height: 350px;
  overflow: auto;
  white-space: pre-wrap;
  line-height: 1.75;
}

.footer {
  border-top: 1px solid var(--border);
  padding: 12px 21px;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 10px;
}

.mobile {
  display: none;
}

.overlay {
  position: fixed;
  inset: 0;
  background: var(--backdrop);
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 8vh 14px;
  overflow: auto;
}

.dialog {
  background: var(--dialog-bg);
  border: 1px solid var(--dialog-edge);
  border-radius: 13px;
  width: min(650px, 100%);
  box-shadow: 0 35px 90px var(--dialog-shadow);
}

.dialoghead {
  padding: 17px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.dialogbody {
  padding: 20px;
  max-height: 68vh;
  overflow: auto;
}

.dialogfoot {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.lined {
  border-top: 1px solid var(--border);
  padding-top: 14px;
  margin-top: 14px;
}

.cliDock {
  border-top: 1px solid var(--dock-edge);
  background: var(--dock-bg);
  padding: 9px 21px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.cliDock input {
  background: transparent;
  color: var(--text);
  border: 0;
  outline: 0;
  flex: 1;
  min-width: 0;
}

.kbdcaption {
  font-size: 10px;
  color: var(--kbd-ink);
}

.avatar {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: var(--avatar-bg);
  border: 1px solid var(--avatar-edge);
  border-radius: 8px;
  color: var(--accent);
  font-weight: 800;
}

.notice {
  border: 1px solid var(--notice-edge);
  background: var(--notice-bg);
  padding: 14px;
  border-radius: 7px;
}

.planout {
  margin-top: 15px;
  border: 1px dashed var(--plan-edge);
  border-radius: 7px;
  padding: 13px;
}

.actionrow {
  display: flex;
  gap: 8px;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
  flex-wrap: wrap;
}

@media (max-width: 1050px) {
  .sidebar {
    width: 185px;
  }
  .four {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .twocol {
    grid-template-columns: 1fr;
  }
  .body {
    padding: 20px;
  }
}
@media (max-width: 720px) {
  .app {
    display: block;
  }
  .sidebar {
    display: none;
  }
  .mobile {
    display: flex;
    overflow: auto;
    gap: 6px;
    background: var(--mobile-bg);
    padding: 8px;
  }
  .mobile button {
    white-space: nowrap;
  }
  .body {
    padding: 15px;
  }
  .four, .three, .two {
    grid-template-columns: 1fr;
  }
  .pagehead h1 {
    font-size: 22px;
  }
  .topbar {
    padding: 0 13px;
  }
  .topbar .hotkey {
    display: none;
  }
  .tableitem {
    grid-template-columns: minmax(0, 1fr) 86px;
  }
  .tableitem > :last-child {
    display: none;
  }
  .cliDock {
    padding: 10px;
  }
