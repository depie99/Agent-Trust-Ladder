}

.task-control-meta {

  align-items: center;
  gap: 8px;
  min-width: 0;
}

.task-inspector-main {

.task-prop-row {
  display: flex;

}

    gap: 10px;
  }
  .task-controls {
    justify-content: space-between;
    min-width: 0;

  .task-actions {

  gap: 10px;
}

.source-hint {
  margin: 0;
  color: var(--faint);
  font-size: 10.5px;
  line-height: 1.7;
}

.source-hint .pill {
  display: table;
  margin-top: 8px;
}

.source-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  border-top: 1px solid var(--row-line);
  padding-top: 12px;
  margin-top: auto;
}

.source-workbench {
  margin-top: 18px;
}

.source-workbench > .paneltitle {
  background: var(--raised);
  gap: 12px;
  flex-wrap: wrap;
}

.source-notice {
  padding: 10px 18px;
  margin: 0;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
  overflow-wrap: anywhere;
}

.source-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 18px;
  background: var(--dialog-bg);
  border-bottom: 1px solid var(--border);
}

.source-tabs {
  display: flex;
  padding: 3px;
  background: var(--field-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.source-tab {
  background: transparent;
  color: var(--muted);
  border: 0;
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 10px;
  white-space: nowrap;
}

.source-tab[aria-pressed=true] {
  background: var(--btn-bg);
  color: var(--accent);
  font-weight: 800;
}

.source-toolbar > .input {
  flex: 1 1 210px;
  width: auto;
}

.source-import-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-inline-start: auto;
  font-size: 10.5px;
  flex-wrap: wrap;
}

.source-import-controls .input {
  width: 132px;
}

.source-import-controls .btn {
  white-space: nowrap;
}

.source-table-scroll {
  overflow-x: auto;
}

.source-table {
  width: 100%;
  border-collapse: collapse;
  text-align: start;
  font-size: 11px;
}

.source-table th {
  padding: 7px 10px;
  background: var(--field-bg);
  color: var(--faint);
  font-size: 9.5px;
  text-transform: uppercase;
  text-align: start;
  white-space: nowrap;
}

.source-table th:first-child, .source-table td:first-child {
  padding-inline-start: 18px;
  width: 36px;
}

.source-table td {
  padding: 12px 10px;
  border-top: 1px solid var(--border);
}

.source-table tr:has(input:checked) {
  background: color-mix(in srgb, var(--accent) 5%, var(--pane));
}

.source-table tr[hidden] {
  display: none;
}

.source-key {
  display: inline-block;
  white-space: nowrap;
  padding: 3px 8px;
  border: 1px solid var(--pill-edge);
  border-radius: 5px;
  font-size: 10.5px;
  font-weight: 800;
}

.source-issue-copy {
  min-width: 230px;
  max-width: 550px;
}

.source-issue-copy b {
  display: block;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.source-issue-copy > span {
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--muted);
  margin-top: 3px;
  font-size: 10.5px;
  overflow-wrap: anywhere;
}

.source-empty {
  padding: 30px 18px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.source-footnote {
  margin: 0;
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--muted);
}

@media (max-width: 1150px) {
  .source-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .source-card:last-child {
    grid-column: 1/-1;
  }
  .issue-sources .pagehead {
    flex-wrap: wrap;
  }
}
@media (max-width: 650px) {
  .source-readiness {
    min-height: 35px;
  }
  .source-grid {
    grid-template-columns: minmax(0, 1fr);
  }
  .source-card:last-child {
    grid-column: auto;
  }
  .source-import-controls {
    margin-inline-start: 0;
    width: 100%;
  }
  .source-import-controls .input {
    flex: 1;
    min-width: 80px;
  }
  .source-import-controls label {
    width: 100%;
  }
  .source-toolbar {
    padding: 12px;
  }
  .source-tabs {
    max-width: 100%;
    flex-wrap: wrap;
  }
  .source-workbench > .paneltitle {
    padding: 12px;
  }
}

('')+'</select></div><div class="field"><label class="label">Agent</label><select class="input" id="fAgent">'+agents.map(a=>'<option '+(a[0]===t?.agent?'selected':'')+'>'+a[0]+'</option>').join('')+'</select></div><div class="field"><label class="label">Status</label><select class="input" id="fStatus">'+['Queued','Running','Blocked','Review','Done'].map(s=>'<option '+(s===(t?.status||'Queued')?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="field"><label class="label">Priority</label><select class="input" id="fPriority">'+['Low','Medium','High','Critical'].map(s=>'<option '+(s===(t?.priority||'Medium')?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div><p class="sub">Changes remain in memory only; reload resets demo data.</p>',btn('Cancel','close')+btn('Save task','save:'+(t?.id||''),'primary'));$('#fTitle').focus()}function detail(t){popup(t.id+' / Task details','<div class="bar">'+badge(t.status)+badge(t.priority)+'<span class="muted">'+escape(t.queue)+' · '+escape(t.agent)+'</span></div><h2 style="font-size:18px;margin:17px 0">'+escape(t.title)+'</h2><p>'+escape(t.desc)+'</p>'+(t.block?'<div class="notice"><b class="red">BLOCKER</b><p>'+escape(t.block)+'</p></div>':'')+'<div class="lined muted tiny">Skill path: atl-plan → atl-implement → verification</div>',btn('Archive','archive:'+t.id,'danger')+btn('Edit','edit:'+t.id)+btn('Plan task','plan:'+t.id,'primary'))}function commandOptions(q=''){return [...routes.map(r=>['Go to '+r[2],'go:'+r[0]]),['New task','new'],['CLI console','cli'],['Review blockers','blockers']].filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map(x=>'<button class="nav" data-action="'+x[1]+'">› '+x[0]+'</button>').join('')||'<p class="muted">No matching command</p>'}function palette(){popup('Command palette <span class="muted tiny">Ctrl K</span>','<input class="input" id="paletteQ" placeholder="Find a page or action..."><div id="paletteItems">'+commandOptions()+'</div>');$('#paletteQ').focus()}functi #fDesc').value,status:$('#fStatus').value,priority:$('#fPriority').value,queue:$('#fQueue').value,agent:$('#fAgent').value});close();go('tasks');return}if(a==='generate'){let goal=$('#goal').value.trim();$('#planOutput').innerHTML='<b class="green">Local draft breakdown</b><p>'+escape(goal)+'</p><ol><li>Define state and persistence contracts.</li><li>Specify UI pages and interaction behavior.</li><li>Write acceptance and recovery tests.</li><li>Implement bounded tasks with owner approval gates.</li><li>Verify runtime logs, accessibility and provider-limit provenance.</li></ol><span class="muted tiny">Mock only; ATL skills and provider have not been called.</span>';return}if(a.startsWith('queue:')){queueFilter=decodeURIComponent(a.slice(6));filter='All';go('tasks');return}if(a.startsWith('run:')){alertDemo('Real execution requires ATL manager connectivity, an approved plan and queue permissions.');return}if(a.startsWith('agent:')){let agent=agents.find(x=>x[0]===a.slice(6));popup(agent[0]+' / Agent brief','<div class="bar">'+badge(agent[2])+'<span>'+agent[1]+'</span></div><p>Current assignment: '+agent[3]+'</p>'+meter(agent[4])+'<p class="sub space">A production agent brief also links its session, model usage, latest log lines, handoffs, test evidence and checkpoint.</p>',btn('Logs','go:activity')+btn('Close','close'));return}if(a==='newqueue'){popup('Create named queue','<label class="label">Queue name</label><input class="input" id="queueName" placeholder="e.g. Security">',btn('Cancel','close')+btn('Create','savequeue','primary'));return}if(a==='savequeue'){let x=$('#queueName').value.trim();if(x&&!queues.includes(x)){queues.push(x);close();go('queues')}return}if(a==='overnight'){popup('Overnight handoff · sample','<h2>46 tests passed · 2 skipped</h2><p class="sub">Example report. In production include run IDs, code changes, test evidence, failure causes, retries and resume checkpoints.</p>',btn('Close','close'));return}if(a==='refresh'){alertDemo('Authoritative usage sampling requires a connected provider adapter. Remaining capacity is unknown.');return}if(a==='export'){let blob=new Blob([events.map(e=>e.join(' | ')).join('\n')],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='atl-demo-activity.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}}
