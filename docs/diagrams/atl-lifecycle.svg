<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" role="img" aria-labelledby="title desc"><title id="title">ATL lifecycle diagram</title><desc id="desc">The lifecycle of an engineering request from idea through earned trust, including a rework loop when evidence is insufficient.</desc><defs><style>text{font-family:system-ui,sans-serif;fill:#eef0f7}.t{font-size:22px;font-weight:700}.l{font-size:14px;font-weight:650}.s{font-size:11px;fill:#a5a8ba}.z{fill:#11121a;stroke:#383a4b;stroke-dasharray:6 5}.n{stroke-width:1}.p{fill:#1f2540;stroke:#7f9bff}.r{fill:#172d2c;stroke:#5fe0c2}.v{fill:#271e35;stroke:#fa8f83}.x{fill:#302817;stroke:#f4c67e}.e{stroke:#7771b8;stroke-width:2;fill:none}.d{stroke:#d5a858;stroke-width:2;fill:none;stroke-dasharray:6 4}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#7771b8"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#d5a858"/></marker></defs><text x="24" y="36" class="t">ATL · lifecycle states</text><text x="24" y="58" class="s">A request earns trust through observable gates, not through time or merge status.</text><rect x="20" y="82" width="940" height="270" rx="14" class="z"/><path d="M148 190h24m132 0h24m132 0h24m132 0h24m132 0h24" class="e" marker-end="url(#a)"/><g transform="translate(38 155)"><rect width="110" height="70" rx="10" class="n p"/><text x="15" y="29" class="l">Idea</text><text x="15" y="50" class="s">raw</text></g><g transform="translate(196 155)"><rect width="110" height="70" rx="10" class="n p"/><text x="15" y="29" class="l">Framed</text><text x="15" y="50" class="s">bounded</text></g><g transform="translate(354 155)"><rect width="110" height="70" rx="10" class="n p"/><text x="15" y="29" class="l">Planned</text><text x="15" y="50" class="s">mapped</text></g><g transform="translate(512 155)"><rect width="110" height="70" rx="10" class="n p"/><text x="15" y="29" class="l">Built</text><text x="15" y="50" class="s">changed</text></g><g transform="translate(670 155)"><rect width="110" height="70" rx="10" class="n r"/><text x="15" y="29" class="l">Verified</text><text x="15" y="50" class="s">observed</text></g><g transform="translate(828 155)"><rect width="110" height="70" rx="10" class="n v"/><text x="15" y="29" class="l">Trusted</text><text x="15" y="50" class="s">earned</text></g><path d="M725 225v58H405v-58" class="d" marker-end="url(#b)"/><text x="470" y="307" class="s">insufficient evidence → repair / reverify</text><text x="24" y="400" class="s">Use for: delivery status, gates, rollback, and autonomy decisions.</text></svg>
