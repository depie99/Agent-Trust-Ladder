<text x="286" y="46" fill="#6f7181" font-family="monospace" font-size="13">ATL /</text><text x="342" y="46" fill="#9698a8" font-family="system-ui" font-size="14">Overview</text><rect x="1170" y="24" width="116" height="30" rx="7" fill="#1b1930"/><text x="1190" y="44" fill="#9b8cff" font-family="monospace" font-size="13">CTRL K</text><rect x="1302" y="24" width="105" height="30" rx="7" fill="#9b8cff"/><text x="1322" y="44" fill="#0b0b10" font-family="system-ui" font-size="13" font-weight="700">+ New task</text>
<text x="286" y="126" fill="#6f7181" font-family="monospace" font-size="13">PORTFOLIO / OWNER VIEW</text><text x="286" y="170" fill="#f5f5f7" font-family="system-ui" font-size="36" font-weight="700">Keep the gates.</text><text x="286" y="202" fill="#9698a8" font-family="system-ui" font-size="16">Shape work, inspect evidence, and explicitly authorize bounded execution.</text>
<g font-family="system-ui"><rect x="286" y="250" width="260" height="116" rx="14" fill="#12131a" stroke="#292a36"/><text x="310" y="284" fill="#6f7181" font-family="monospace" font-size="13">ACTIVE TASKS</text><text x="310" y="328" fill="#f5f5f7" font-size="36" font-weight="700">05</text><text x="398" y="328" fill="#9698a8" font-size="14">portfolio items</text><rect x="566" y="250" width="260" height="116" rx="14" fill="#12131a" stroke="#292a36"/><text x="590" y="284" fill="#6f7181" font-family="monospace" font-size="13">BLOCKED</text><text x="590" y="328" fill="#f4c67e" font-size="36" font-weight="700">01</text><text x="678" y="328" fill="#9698a8" font-size="14">owner decision</text><rect x="846" y="250" width="510" height="116" rx="14" fill="#12131a" stroke="#292a36"/><text x="870" y="284" fill="#6f7181" font-family="monospace" font-size="13">EXECUTION SAFETY</text><text x="870" y="328" fill="#5fe0c2" font-size="21" font-weight="700">Preview → Confirm</text><text x="1128" y="328" fill="#9698a8" font-size="14">no provider call before confirmation</text></g>
