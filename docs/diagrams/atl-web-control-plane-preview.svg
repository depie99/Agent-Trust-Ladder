<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">Representative ATL Web Control Plane preview</title><desc id="desc">Sanitized representative browser preview with eight sidebar spaces, portfolio cards, task list, and a preview-before-confirmation panel.</desc>
<rect width="1440" height="860" fill="#0b0b10"/><rect width="250" height="860" fill="#0e0f14"/><path d="M250 0v860M250 72h1190" stroke="#292a36"/>
