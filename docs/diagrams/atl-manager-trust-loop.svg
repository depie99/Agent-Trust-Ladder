<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" role="img" aria-labelledby="title desc"><title id="title">ATL Manager trust improvement loop</title><desc id="desc">A loop: a task finishes with observed evidence, becomes a run record, receives independent review verdicts, feeds an autonomy assessment, and updates routing budgets and gates. The next task starts with earned trust. Insufficient or noisy evidence exits the loop and trust stays or drops.</desc><defs><style>text{font-family:system-ui,sans-serif;fill:#eef0f7}.t{font-size:22px;font-weight:700}.l{font-size:14px;font-weight:650}.s{font-size:11px;fill:#a5a8ba}.z{fill:#11121a;stroke:#383a4b;stroke-dasharray:6 5}.n{stroke-width:1}.p{fill:#1f2540;stroke:#7f9bff}.r{fill:#172d2c;stroke:#5fe0c2}.v{fill:#271e35;stroke:#fa8f83}.x{fill:#302817;stroke:#f4c67e}.e{stroke:#7771b8;stroke-width:2;fill:none}.d{stroke:#d5a858;stroke-width:2;fill:none;stroke-dasharray:6 4}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#7771b8"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#d5a858"/></marker></defs><text x="24" y="36" class="t">ATL Manager · how the team earns trust</text><text x="24" y="58" class="s">Every run leaves evidence; evidence feeds the trust ladder; the ladder widens autonomy in small, revocable steps.</text><rect x="20" y="82" width="940" height="330" rx="14" class="z"/><path d="M188 185h32m150 0h32m150 0h32m150 0h32" class="e" marker-end="url(#a)"/><g transform="translate(38 150)"><rect width="150" height="70" rx="10" class="n r"/><text x="15" y="29" class="l">Task done</text><text x="15" y="50" class="s">checks observed</text></g><g transform="translate(220 150)"><rect width="150" height="70" rx="10" class="n p"/><text x="15" y="29" class="l">Run record</text><text x="15" y="50" class="s">.trust/agent-runs/</text></g><g transform="translate(402 150)"><rect width="150" height="70" rx="10" class="n p"/><text x="15" y="29" class="l">Review verdicts</text><text x="15" y="50" class="s">Sage · independent</text></g><g transform="translate(584 150)"><rect width="150" height="70" rx="10" class="n p"/><text x="15" y="29" class="l">atl-trust</text><text x="15" y="50" class="s">assess autonomy</text></g><g transform="translate(766 150)"><rect width="150" height="70" rx="10" class="n x"/><text x="15" y="29" class="l">Routing update</text><text x="15" y="50" class="s">budgets · gates · models</text></g><path d="M841 220v70H113v-70" class="e" marker-end="url(#a)"/><text x="240" y="284" class="s">next task starts with earned trust — and earned budget</text><path d="M477 220v100" class="d" marker-end="url(#b)"/><text x="487" y="268" class="s">insufficient or noisy evidence</text><g transform="translate(402 320)"><rect width="150" height="60" rx="10" class="n v"/><text x="15" y="25" class="l">Trust stays</text><text x="15" y="44" class="s">or drops · gates tighten</text></g><text x="24" y="440" class="s">Use for: deciding what to automate next, and what stays a human decision.</text></svg>
