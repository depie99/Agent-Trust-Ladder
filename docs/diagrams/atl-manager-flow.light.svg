<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="title desc"><title id="title">ATL Manager work flow diagram</title><desc id="desc">Work flows from intake sources through Pip triage, Mira routing, Rowan build, Sage review, and Beacon verification to done. Blocked work carries a retry timer and escalates to a human decision. Review can send work back to build.</desc><defs><style>text{font-family:system-ui,sans-serif;fill:#1a1826}.t{font-size:22px;font-weight:700}.l{font-size:14px;font-weight:650}.s{font-size:11px;fill:#5d5b72}.z{fill:#ffffff;stroke:#dedde6;stroke-dasharray:6 5}.n{stroke-width:1}.p{fill:#ffffff;stroke:#3565d6}.r{fill:#d9f2ea;stroke:#0a7d66}.v{fill:#e8e2fb;stroke:#bb4534}.x{fill:#f8eed7;stroke:#9a6709}.e{stroke:#c3b9f2;stroke-width:2;fill:none}.d{stroke:#c9973a;stroke-width:2;fill:none;stroke-dasharray:6 4}.f{stroke:#bb4534;stroke-width:2;fill:none;stroke-dasharray:6 4}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#c3b9f2"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#c9973a"/></marker><marker id="c" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#bb4534"/></marker></defs><text x="24" y="36" class="t">ATL Manager · how work flows</text><text x="24" y="58" class="s">Sources are deduped into one state machine; every handoff is gated by role and observed evidence.</text><rect x="20" y="82" width="940" height="320" rx="14" class="z"/><path d="M172 175h16m140 0h16m140 0h16m140 0h16m140 0h16" class="e" marker-end="url(#a)"/><path d="M726 140v-24H570v24" class="d" marker-end="url(#b)"/><text x="588" y="110" class="s">changes requested → rework</text><g transform="translate(32 140)"><rect width="140" height="70" rx="10" class="n p"/><text x="14" y="29" class="l">Intake</text><text x="14" y="50" class="s">file · github · azure</text></g><g transform="translate(188 140)"><rect width="140" height="70" rx="10" class="n p"/><text x="14" y="29" class="l">Triage · Pip</text><text x="14" y="50" class="s">objective + checks</text></g><g transform="translate(344 140)"><rect width="140" height="70" rx="10" class="n p"/><text x="14" y="29" class="l">Route · Mira</text><text x="14" y="50" class="s">assign + budget</text></g><g transform="translate(500 140)"><rect width="140" height="70" rx="10" class="n p"/><text x="14" y="29" class="l">Build · Rowan</text><text x="14" y="50" class="s">isolated workspace</text></g><g transform="translate(656 140)"><rect width="140" height="70" rx="10" class="n r"/><text x="14" y="29" class="l">Review · Sage</text><text x="14" y="50" class="s">independent</text></g><g transform="translate(812 140)"><rect width="140" height="70" rx="10" class="n r"/><text x="14" y="29" class="l">Verify · Beacon</text><text x="14" y="50" class="s">finish conditions</text></g><path d="M882 210v58" class="e" marker-end="url(#a)"/><g transform="translate(812 268)"><rect width="140" height="70" rx="10" class="n r"/><text x="14" y="29" class="l">Done</text><text x="14" y="50" class="s">brief to manager</text></g><path d="M570 210v60H400" class="d" marker-end="url(#b)"/><text x="430" y="262" class="s">block --reason --wake-in</text><g transform="translate(250 268)"><rect width="150" height="70" rx="10" class="n x"/><text x="13" y="29" class="l">Blocked · timer</text><text x="13" y="50" class="s">Beacon watches the wake</text></g><path d="M250 303h-62" class="d" marker-end="url(#b)"/><text x="196" y="296" class="s">escalate</text><g transform="translate(38 268)"><rect width="150" height="70" rx="10" class="n v"/><text x="13" y="29" class="l">Manager decision</text><text x="13" y="50" class="s">merge · deploy · access</text></g><path d="M113 268v-28h301v-30" class="f" marker-end="url(#c)"/><text x="250" y="234" class="s">human gates: merge / deploy / spend / policy</text><text x="24" y="440" class="s">Use for: onboarding the team, explaining handoffs, and seeing where the human decides.</text></svg>
