  <text x="1069.5" y="29" text-anchor="middle" class="title">atl ui — c · compose</text>
  <text x="28.0" y="76.0" fill="#f5f5f7" textLength="1170.0" xml:space="preserve">┌─ COMPOSE · INTENT · 1/4 ───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐</text>
  <text x="28.0" y="95.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│NOT SURE WHAT TO WRITE?                                                                                                                           │</text>
  <text x="28.0" y="114.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│Start from the outcome, not an ATL field.                                                                                                         │</text>
  <text x="28.0" y="133.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│Choose a shape for the work, then describe it in your own words. ATL keeps the raw draft and prepares a reviewable packet.                        │</text>
  <text x="28.0" y="152.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="171.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│What should change?                                                                                                                               │</text>
  <text x="28.0" y="190.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="209.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│  f  Fix a problem                                                                                                                                │</text>
  <text x="28.0" y="228.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│    Repair an observed failure, mismatch, or regression.                                                                                          │</text>
  <text x="28.0" y="247.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│▸ b  Build a capability                                                                                                                           │</text>
  <text x="28.0" y="266.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│    Add behavior, a workflow, or a user-facing feature.                                                                                           │</text>
  <text x="28.0" y="285.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│  d  Document or explain                                                                                                                          │</text>
  <text x="28.0" y="304.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│    Make a system, decision, or process understandable.                                                                                           │</text>
  <text x="28.0" y="323.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│  o  Operate or recover                                                                                                                           │</text>
  <text x="28.0" y="342.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│    Run, diagnose, contain, or restore a system.                                                                                                  │</text>
  <text x="28.0" y="361.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="380.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│↑↓ / j k move · Enter choose · 1-4 jump · Esc cancel                                                                                              │</text>
