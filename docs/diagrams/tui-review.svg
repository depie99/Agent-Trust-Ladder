  <rect width="2349" height="614" rx="16" fill="url(#bg-review)"/>
  <rect x="1" y="1" width="2347" height="612" rx="15" fill="none" stroke="#3d3752"/>
  <line x1="1" y1="46" x2="2348" y2="46" stroke="#26272f"/>
  <circle cx="32" cy="25" r="6" fill="#fa8f83"/><circle cx="52" cy="25" r="6" fill="#f4c67e"/><circle cx="72" cy="25" r="6" fill="#5fe0c2"/>
  <text x="1174.5" y="29" text-anchor="middle" class="title">atl ui — e · packet review</text>
  <text x="28.0" y="76.0" fill="#f5f5f7" textLength="1170.0" xml:space="preserve">┌─ PACKET REVIEW ────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐</text>
  <text x="28.0" y="95.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│T-001  ● Running  ⌁ queued                                                                                                                        │</text>
  <text x="28.0" y="114.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│Fix login redirect loop on expired sessions                                                                                                       │</text>
  <text x="28.0" y="133.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="152.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│OBJECTIVE An expired session redirects to /login exactly once and returns to the original deep link after sign-in.                                │</text>
  <text x="28.0" y="171.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="190.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│CHECKS · 3  (n add · d+digit remove)                                                                                                              │</text>
  <text x="28.0" y="209.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│ 1 valid session is never bounced to /login                                                                                                       │</text>
  <text x="28.0" y="228.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│ 2 expired session redirects exactly once                                                                                                         │</text>
  <text x="28.0" y="247.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│ 3 original deep link is restored after sign-in                                                                                                   │</text>
  <text x="28.0" y="266.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="285.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│RESOURCES · 1  (a add link/file/image)                                                                                                            │</text>
  <text x="28.0" y="304.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│[url] issue: https://github.com/acme/app/issues/12                                                                                                │</text>
  <text x="28.0" y="323.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="342.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│priority urgent (p cycles)   risk normal (k toggles)                                                                                              │</text>
  <text x="28.0" y="361.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│route atl-implement → rowan (t reroutes)                                                                                                          │</text>
  <text x="28.0" y="380.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│resources 1 attached (a adds link/file/image)                                                                                                     │</text>
  <text x="28.0" y="399.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│framed Fix a problem · Repository / code                                                                                                          │</text>
  <text x="28.0" y="418.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│source https://github.com/acme/app/issues/12                                                                                                      │</text>
  <text x="28.0" y="437.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="456.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│o edit objective · a add resource · x queue toggle · T approve packet → triaged (manager override)                                                │</text>
  <text x="28.0" y="475.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│Esc back — l opens the launch gate; Enter / y confirms the queued run                                                                             │</text>
  <text x="28.0" y="494.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="513.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="532.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="551.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="570.0" fill="#f5f5f7" textLength="1154.4" xml:space="preserve">│                                                                                                                                                  │</text>
  <text x="28.0" y="589.0" fill="#f5f5f7" textLength="1170.0" xml:space="preserve">└────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘</text>
</svg>
