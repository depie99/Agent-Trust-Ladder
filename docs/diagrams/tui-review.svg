<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2349 614" role="img" aria-labelledby="t-review d-review">
  <title id="t-review">atl ui — e · packet review</title>
  <desc id="d-review">Terminal window showing the ATL control room: atl ui — e · packet review. Generated by scripts/render-tui-images.mjs from the live dashboard renderers.</desc>
  <defs>
    <linearGradient id="bg-review" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c0d13"/><stop offset="1" stop-color="#141322"/></linearGradient>
    <style>
      text{font-family:ui-monospace,'Cascadia Mono','Cascadia Code',Consolas,Menlo,monospace;font-size:13px}
      .title{fill:#8a8ca0;font-size:12.5px;font-family:'Segoe UI',system-ui,sans-serif;letter-spacing:.4px}
    </style>
