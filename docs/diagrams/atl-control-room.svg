<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ATL Control Room terminal preview</title>
  <desc id="desc">A dark terminal control room with a portfolio list, lifecycle pipeline, selected task packet, live feed, provider mapping, and keyboard controls for create, edit, queue, run, and refresh.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0c0d13"/><stop offset="1" stop-color="#151322"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#272443"/><stop offset="1" stop-color="#1b1b30"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop stop-color="#172c2c"/><stop offset="1" stop-color="#14211f"/></linearGradient>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#f5f5f7}
      .muted{fill:#9698a8}.faint{fill:#6f7181}.violet{fill:#9b8cff}.mint{fill:#5fe0c2}.amber{fill:#f4c67e}.coral{fill:#fa8f83}
      .label{font-size:16px;font-weight:700;letter-spacing:1px}.body{font-size:15px}.small{font-size:13px}.tiny{font-size:11px}
      .panel{fill:#12131a;stroke:#303140;stroke-width:2}.focus{fill:#392b4e;stroke:#fa8f83;stroke-width:2}.line{stroke:#303140;stroke-width:2}.dot{stroke:#6f7181;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1280" height="720" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="1244" height="684" rx="14" fill="none" stroke="#413963"/>
  <text x="42" y="58" class="label coral">▌</text><text x="66" y="58" class="label">ATL</text><text x="118" y="58" class="label muted">CONTROL ROOM</text><text x="1034" y="58" class="small mint">● LIVE · NAVIGATE</text>
  <line x1="42" y1="78" x2="1238" y2="78" class="line"/>
  <text x="42" y="108" class="small faint">PORTFOLIO</text><text x="150" y="108" class="body">7 tasks</text><text x="260" y="108" class="small mint">2 shipped</text><text x="392" y="108" class="small violet">4 active</text><text x="520" y="108" class="small amber">1 blocked</text><text x="654" y="108" class="small coral">0 escalated</text>
  <text x="42" y="136" class="small faint">LIFECYCLE</text><text x="150" y="136" class="small muted">○ New 1  ──›  ◌ Triage 1  ──›  ◔ Assign 1  ──›  ● Run 2  ──›  ◉ Review 1  ──›  ◍ Verify 0  ──›  ◆ Done 2</text>

  <rect x="42" y="168" width="306" height="430" rx="10" class="panel"/>
  <text x="62" y="198" class="label coral">PORTFOLIO · FOCUS 2/7</text>
  <rect x="58" y="218" width="274" height="52" rx="7" class="focus"/><text x="74" y="242" class="body">▸ + T-014  Connect GLM via ZCode</text><text x="74" y="260" class="small violet">◔ Assign · rowan · 4m ago</text>
  <text x="72" y="300" class="body amber">+ T-015  Add import from GitHub</text><text x="72" y="322" class="small muted">◉ Review · sage · 18m ago</text>
  <text x="72" y="362" class="body">· T-016  Refresh the docs</text><text x="72" y="384" class="small mint">● Running · pip · now</text>
  <text x="72" y="424" class="body">⌁ T-017  Verify release notes</text><text x="72" y="446" class="small faint">◌ Triage · queued</text>
  <text x="62" y="560" class="small muted">⌁ queue membership is separate</text><text x="62" y="580" class="small muted">from keyboard focus.</text>

  <rect x="368" y="168" width="548" height="430" rx="10" fill="url(#violet)" stroke="#9b8cff" stroke-width="2"/>
  <text x="388" y="198" class="label violet">SELECTED TASK</text><text x="388" y="232" class="body">T-014  ◔ Assigned</text><text x="388" y="260" class="body">Connect GLM through the user's ZCode CLI</text>
  <text x="388" y="304" class="small faint">OBJECTIVE</text><text x="388" y="328" class="small">Allow a configured custom provider to receive</text><text x="388" y="348" class="small">the same bounded ATL role prompt as Codex.</text>
  <text x="388" y="388" class="small faint">ROUTE</text><text x="472" y="388" class="small violet">atl-plan → atl-implement → atl-verify</text>
  <text x="388" y="416" class="small faint">PROVIDER</text><text x="472" y="416" class="small mint">glm · zcode · glm-4.6</text>
  <text x="388" y="444" class="small faint">WORKSPACE</text><text x="472" y="444" class="small">isolated T-014 worktree</text>
  <text x="388" y="480" class="small faint">CHECKS · 3</text><text x="388" y="504" class="small mint">✓ dry-run prints the configured command</text><text x="388" y="526" class="small amber">· confirmed run still requires human approval</text><text x="388" y="548" class="small muted">· provider failure becomes a blocker</text>

  <rect x="936" y="168" width="302" height="430" rx="10" fill="url(#mint)" stroke="#5fe0c2" stroke-width="2"/>
  <text x="956" y="198" class="label mint">LIVE FEED</text><text x="956" y="232" class="small faint">01:25 PM  ⚙ Runner</text><text x="956" y="254" class="small">preview built for T-014</text><text x="956" y="276" class="small">provider: glm / subscription</text>
  <text x="956" y="320" class="small faint">01:24 PM  🔨 Rowan</text><text x="956" y="342" class="small">packet accepted; waiting</text><text x="956" y="364" class="small">for execution selection.</text>
  <text x="956" y="408" class="small faint">01:21 PM  ◈ Sage</text><text x="956" y="430" class="small">reviewed the task contract</text><text x="956" y="452" class="small">and left one check.</text>
  <text x="956" y="548" class="small amber">provider sessions are logged</text><text x="956" y="570" class="small muted">under .trust/manager/overnight</text>

  <line x1="42" y1="626" x2="1238" y2="626" class="line"/>
  <text x="42" y="660" class="small coral">↑↓/jk</text><text x="112" y="660" class="small muted">move</text><text x="168" y="660" class="small coral">c</text><text x="184" y="660" class="small muted">create</text><text x="258" y="660" class="small coral">e</text><text x="274" y="660" class="small muted">edit</text><text x="330" y="660" class="small coral">x</text><text x="346" y="660" class="small muted">queue</text><text x="408" y="660" class="small coral">l</text><text x="424" y="660" class="small muted">preview</text><text x="500" y="660" class="small coral">Enter/y</text><text x="558" y="660" class="small muted">run</text><text x="608" y="660" class="small coral">r</text><text x="624" y="660" class="small muted">refresh</text><text x="700" y="660" class="small coral">p</text><text x="716" y="660" class="small muted">providers</text><text x="824" y="660" class="small coral">?</text><text x="840" y="660" class="small muted">help</text><text x="912" y="660" class="small coral">q</text><text x="928" y="660" class="small muted">quit</text>
</svg>
