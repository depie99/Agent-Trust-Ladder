<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc"><title id="title">ATL change impact map</title><desc id="desc">A change request at the center connected to code, contracts, documentation, UI, deployment, and evidence consumers.</desc><defs><style>text{font-family:system-ui,sans-serif;fill:#eef0f7}.t{font-size:22px;font-weight:700}.l{font-size:14px;font-weight:650}.s{font-size:11px;fill:#a5a8ba}.n{stroke-width:1}.c{fill:#272346;stroke:#9b8cff}.p{fill:#1f2540;stroke:#7f9bff}.r{fill:#172d2c;stroke:#5fe0c2}.x{fill:#302817;stroke:#f4c67e}.o{fill:#271e35;stroke:#fa8f83}.e{stroke:#7771b8;stroke-width:1.8;fill:none}.d{stroke:#d5a858;stroke-width:1.5;fill:none;stroke-dasharray:5 4}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#7771b8"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#d5a858"/></marker></defs><text x="24" y="36" class="t">ATL · change impact map</text><text x="24" y="58" class="s">Trace one change across technical, user, operational, and knowledge surfaces.</text><path d="M490 220 190 130M490 220 390 100M490 220 590 100M490 220 790 130M490 280 190 380M490 280 390 405M490 280 590 405M490 280 790 380" class="e" marker-end="url(#a)"/><g transform="translate(370 190)"><rect width="240" height="100" rx="16" class="n c"/><text x="25" y="42" class="t">One change</text><text x="25" y="68" class="s">intent + affected contract</text></g><g transform="translate(90 100)"><rect width="180" height="58" rx="10" class="n p"/><text x="18" y="25" class="l">Source code</text><text x="18" y="45" class="s">callers + behavior</text></g><g transform="translate(300 70)"><rect width="180" height="58" rx="10" class="n p"/><text x="18" y="25" class="l">Config / schema</text><text x="18" y="45" class="s">compatibility</text></g><g transform="translate(510 70)"><rect width="180" height="58" rx="10" class="n x"/><text x="18" y="25" class="l">Build / package</text><text x="18" y="45" class="s">artifact shape</text></g><g transform="translate(720 100)"><rect width="180" height="58" rx="10" class="n x"/><text x="18" y="25" class="l">Deployment / runtime</text><text x="18" y="45" class="s">external behavior</text></g><g transform="translate(90 350)"><rect width="180" height="58" rx="10" class="n r"/><text x="18" y="25" class="l">Docs</text><text x="18" y="45" class="s">reader contract</text></g><g transform="translate(300 375)"><rect width="180" height="58" rx="10" class="n r"/><text x="18" y="25" class="l">UI</text><text x="18" y="45" class="s">user-visible result</text></g><g transform="translate(510 375)"><rect width="180" height="58" rx="10" class="n o"/><text x="18" y="25" class="l">Tests / evidence</text><text x="18" y="45" class="s">proof level</text></g><g transform="translate(720 350)"><rect width="180" height="58" rx="10" class="n o"/><text x="18" y="25" class="l">Rollback / owner</text><text x="18" y="45" class="s">containment</text></g><text x="24" y="472" class="s">Solid edges = inspect directly · dashed edges = boundary may remain inferred until observed.</text></svg>
