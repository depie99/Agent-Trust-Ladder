# Docs sync anchor — the boundary the next docs sync diffs from.
# Convention per skills/atl-tech-docs (references/maintenance-workflow.md).
# Advance only after the docs checks pass; never for unverified edits.

doc_set:
  - docs/index.html          # entry point + quickstart
  - docs/skills.html         # skill catalog (19 cards)
  - docs/guides.html         # workflow guides
  - docs/control-room.html   # terminal compose/import/queue/provider guide
  - docs/team.html           # team runtime guide (canonical runtime doc)
  - docs/reference.html      # vocabulary, verdict, evidence levels, dose
  - docs/jev.html            # Jev routing guide (+ docs/jev.md)
  - docs/diagrams.html       # visual models
  - docs/codex-history-bridge.html # Codex app history projection + transport guide
  - README.md                # repo entry point
  - USAGE.md                 # install + quick start
  - runtime/README.md        # CLI/runtime operator guide
  - docs/team-playbook.md    # team runbook

